<!doctype html>
<html lang="de" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
{{meta_seo}}
  <meta name="theme-color" content="#14213d">

  <!-- Kein JS-Flash: Klasse "js" sofort setzen (für zuklappbares Mobilmenü) -->
  <script src="/assets/js/no-js.js"></script>

  <!-- CSS-Reihenfolge = Kaskade: Fonts → Tokens → Base → Layout → Komponenten
       → WordPress: wp_enqueue_style() in functions.php in derselben Reihenfolge -->
  <link rel="preload" href="/assets/fonts/source-serif-4-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/fonts.css">
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/print.css" media="print">
{{head_extra}}
</head>
<body>

{{icons}}

<a class="skip-link" href="#inhalt">Zum Inhalt springen</a>

{{header}}

<main id="inhalt" tabindex="-1">
{{content}}
</main>

{{footer}}

<!-- Quellenangabe im Ausdruck: nur beim Drucken sichtbar (print.css). main.js (11.)
     setzt die Seitenadresse beim beforeprint-Ereignis; ohne JS bleibt sie leer. -->
<p class="print-url print-only" data-print-url></p>

<script src="/assets/js/main.js" defer></script>
{{body_extra}}
</body>
</html>
